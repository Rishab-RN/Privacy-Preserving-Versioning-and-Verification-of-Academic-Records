name: academic-provenance
services:
  neo4j:
    image: neo4j:5.26.33
    environment:
      NEO4J_AUTH: neo4j/${GRAPH_NEO4J_PASSWORD:?Generate local graph configuration first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - '127.0.0.1:${GRAPH_NEO4J_PORT:-57687}:7687'
    volumes:
      - graph-data:/data
volumes:
  graph-data:
