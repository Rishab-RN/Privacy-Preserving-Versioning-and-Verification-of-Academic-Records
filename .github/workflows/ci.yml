name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'test/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run build

  database:
    name: PostgreSQL / MongoDB / Neo4j integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: scholarproof_ci
          POSTGRES_USER: scholarproof_ci
          POSTGRES_PASSWORD: ci-synthetic-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U scholarproof_ci -d scholarproof_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: scholarproof_ci
          MONGO_INITDB_ROOT_PASSWORD: ci-synthetic-only
        ports:
          - 57017:27017
        options: >-
          --health-cmd "mongosh --quiet --username scholarproof_ci --password ci-synthetic-only --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      neo4j:
        image: neo4j:5.26.33
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-synthetic-only
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 57687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-synthetic-only 'RETURN 1'"
          --health-interval 5s
          --health-timeout 8s
          --health-retries 20
    env:
      POSTGRES_DB: scholarproof_ci
      POSTGRES_USER: scholarproof_ci
      POSTGRES_PASSWORD: ci-synthetic-only
      POSTGRES_PORT: '55432'
      MONGO_ROOT_USER: scholarproof_ci
      MONGO_ROOT_PASSWORD: ci-synthetic-only
      MONGO_PORT: '57017'
      GRAPH_NEO4J_PASSWORD: ci-neo4j-synthetic-only
      GRAPH_NEO4J_PORT: '57687'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run test:db
      - run: npm run zk:setup
      - run: npm run test:zk
      - run: npm run test:integration
      - run: npm run db:migrate
      - run: npm run db:status
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run db:plan
      - run: npm run access:setup
      - run: npm run access:demo
      - run: npm run worker:setup
      - run: npm run graph -- setup
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/anomaly/requirements.txt
      - run: python -m pip install -r apps/anomaly/requirements.txt
      - run: python -m unittest discover -s apps/anomaly
      - run: python apps/anomaly/run.py evaluate
      - run: npm run workflow:demo
      - run: npm run build
      - run: npm run access:smoke
      - run: npm run workflow:smoke
      - run: npm run log:setup
      - run: npm run log:demo
      - name: Publish synthetic demonstration ranks
        run: |
          scope=$(node -p "JSON.parse(require('node:fs').readFileSync('.runtime/workflow-fixture.json','utf8')).institutionId")
          npm run graph -- sync "$scope"
          python apps/anomaly/run.py publish "$scope"
      - run: npm run pilot:setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
        env:
          ANOMALY_PYTHON: python
