name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'test/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run build

  database:
    name: PostgreSQL 18 / MongoDB 8 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: scholarproof_ci
          POSTGRES_USER: scholarproof_ci
          POSTGRES_PASSWORD: ci-synthetic-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U scholarproof_ci -d scholarproof_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: scholarproof_ci
          MONGO_INITDB_ROOT_PASSWORD: ci-synthetic-only
        ports:
          - 57017:27017
        options: >-
          --health-cmd "mongosh --quiet --username scholarproof_ci --password ci-synthetic-only --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_DB: scholarproof_ci
      POSTGRES_USER: scholarproof_ci
      POSTGRES_PASSWORD: ci-synthetic-only
      POSTGRES_PORT: '55432'
      MONGO_ROOT_USER: scholarproof_ci
      MONGO_ROOT_PASSWORD: ci-synthetic-only
      MONGO_PORT: '57017'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run test:db
      - run: npm run test:integration
      - run: npm run db:migrate
      - run: npm run db:status
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run db:plan
      - run: npm run access:setup
      - run: npm run access:demo
      - run: npm run worker:setup
      - run: npm run workflow:demo
      - run: npm run build
      - run: npm run access:smoke
      - run: npm run workflow:smoke
